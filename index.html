<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0f4a35;color:#fff;font-family:system-ui,"Segoe UI",Tahoma,sans-serif;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 40%,#1b7a58,#0f4a35 80%);padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 4px;gap:8px}
.pill{background:rgba(0,0,0,.35);border:1px solid rgba(255,215,100,.4);border-radius:14px;padding:6px 12px;font-weight:700;font-size:14px}
.opp{text-align:center}
.back{display:inline-block;width:14px;height:34px;margin:0 2px;background:#1c2530;border-radius:3px;border:1px solid #000}
#board{flex:1;display:flex;align-items:center;overflow-x:auto;direction:ltr;padding:10px}
#board .in{display:flex;align-items:center;margin:0 auto;gap:2px}
.t{display:flex;background:#f6f1e4;border-radius:7px;border:1px solid #8a8570;box-shadow:0 2px 4px rgba(0,0,0,.4);flex:none;direction:ltr}
.t.v{flex-direction:column}
.h{width:34px;height:34px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:4px}

.d{width:6px;height:6px;border-radius:50%;background:#111;margin:auto}
#hand{display:flex;justify-content:center;gap:6px;padding:8px 0;flex-wrap:wrap;direction:ltr}
#hand .t{transform:rotate(0);cursor:pointer;transition:.15s}
#hand .t .h{width:34px;height:34px}
#hand .t{flex-direction:column}
#hand .t .h+.h{border-left:0;border-top:1px solid #9b957f}
#hand .t.ok{outline:3px solid #ffd54a;transform:translateY(-8px)}
#hand .t.sel{outline:3px solid #fff}
.bar{display:flex;justify-content:center;gap:10px;padding:8px;min-height:54px;align-items:center;flex-wrap:wrap}
button{font:inherit;font-weight:700;background:#ffd54a;color:#222;border:0;border-radius:12px;padding:10px 18px}

.card h2{margin:0 0 14px}
.card button{display:block;width:100%;margin:8px 0}
textarea{width:100%;height:90px;border-radius:10px;border:0;padding:8px;direction:ltr;font-size:11px}
.hide{display:none!important}
/* ===== تصميم جديد: أزرق فاتح ===== */
html,body{background:#9fd3f7;color:#0b2a4a}
#app{background:radial-gradient(900px 500px at 50% 0%,rgba(255,255,255,.75),transparent 70%),linear-gradient(165deg,#d9f0ff 0%,#a5d6f8 50%,#6db4ea 100%);padding-left:12px;padding-right:12px}

#board{background:linear-gradient(180deg,rgba(255,255,255,.38),rgba(255,255,255,.18));border:1px solid rgba(255,255,255,.85);border-radius:26px;box-shadow:inset 0 6px 18px rgba(30,100,170,.18),0 8px 24px rgba(20,80,140,.15);margin:4px 0}
.t{position:relative;border-radius:10px;border:1px solid #a9a287;background:linear-gradient(160deg,#fffdf5 0%,#f3ecd8 60%,#e4dcc3 100%);box-shadow:0 1px 0 #fff inset,0 -3px 0 rgba(0,0,0,.08) inset,0 5px 10px rgba(10,50,100,.35)}
.t::after{content:'';position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffeeb5,#b8862b);box-shadow:0 1px 2px rgba(0,0,0,.5);z-index:2}
.h{width:38px;height:38px;padding:6px}
.h+.h{border-left:2px solid #c3bca2}

/* ===== سلاسة الحركة + اختيار الجهة على الطاولة ===== */

.t{will-change:transform}
@keyframes dropIn{0%{transform:translateY(-34px) scale(1.3) rotate(-7deg);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.t.new{animation:dropIn .34s cubic-bezier(.2,.9,.3,1.15)}

#hand .t.ok{animation:rise .3s ease-out,glow 1.7s ease-in-out infinite}

@keyframes zpulse{0%,100%{box-shadow:0 0 0 0 rgba(127,227,255,.55)}50%{box-shadow:0 0 0 10px rgba(127,227,255,0)}}

.win{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(3,10,25,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}

#wt{font-size:88px;line-height:1.1;animation:wfloat 2.2s ease-in-out infinite;filter:drop-shadow(0 8px 14px rgba(255,200,60,.45))}
@keyframes wfloat{50%{transform:translateY(-8px) rotate(-4deg)}}

.win:not(.won) #wh{background:none;color:#cfe0ff}

/* ===== طاولة كحلي + خلفية قوية ===== */
html,body{background:#06194a}
#app{background:
 radial-gradient(620px 420px at 12% 6%,rgba(0,210,255,.5),transparent 62%),
 radial-gradient(720px 520px at 92% 96%,rgba(130,80,255,.55),transparent 62%),
 radial-gradient(circle,rgba(255,255,255,.1) 2px,transparent 2.6px) 0 0/36px 36px,
 linear-gradient(160deg,#1046a8 0%,#0a2c75 48%,#061a4f 100%);
 animation:dots 40s linear infinite}

#board{background:repeating-linear-gradient(45deg,rgba(255,255,255,.025) 0 2px,transparent 2px 9px),radial-gradient(ellipse at 50% 45%,#0f2d5e 0%,#081a38 75%);border:2px solid rgba(255,214,102,.6);box-shadow:inset 0 0 50px rgba(0,0,0,.6),0 0 0 6px rgba(6,20,52,.55),0 14px 34px rgba(0,0,0,.5)}
.t{box-shadow:0 1px 0 #fff inset,0 -3px 0 rgba(0,0,0,.08) inset,0 6px 12px rgba(0,0,0,.65)}
.zone{border-color:#ffd666;color:#ffe9a8;background:rgba(255,214,102,.12)}
@keyframes zpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,214,102,.55)}50%{box-shadow:0 0 0 10px rgba(255,214,102,0)}}
/* ===== لون واحد: كحلي ===== */
html,body,#app{background:#0b2147;animation:none}
#board{background:#0b2147;border:2px solid #1c4180;box-shadow:none}
.zone{border-color:#a9c8ff;color:#d6e6ff;background:rgba(169,200,255,.1)}
@keyframes zpulse{0%,100%{box-shadow:0 0 0 0 rgba(169,200,255,.5)}50%{box-shadow:0 0 0 10px rgba(169,200,255,0)}}

/* ===== كروت ثابتة وهادية ===== */
.t{background:#e4e0d4;border:1px solid #cbc5b3;box-shadow:0 3px 8px rgba(0,0,0,.35)}

/* ===== السلسلة تلف على صفوف بدل السكرول ===== */
#board{overflow-x:hidden;overflow-y:auto;align-items:flex-start;min-height:0;scrollbar-width:thin;scroll-behavior:auto}

<body>
<div id="app">
  <div class="top">
    <div class="pill" id="score">أنت 0 : 0 الخصم</div>
    <div class="opp"><div id="oppname" style="font-weight:700;margin-bottom:4px">الخصم</div><div id="opp"></div></div>
    <div class="pill" id="info">البوكس 14</div>
  </div>
  <div id="board"><div class="in" id="bin"></div></div>
  <div id="msg"></div>
  <div class="bar"><div class="ring" id="ring">25</div><span id="sides"></span><button id="drawBtn" class="hide">اسحب</button></div>
  <div id="hand"></div>
  <div class="credit">تم إنشاء اللعبة بواسطة مينا عاطف</div>
</div>

<button class="g" id="snd" onclick="mute=!mute;this.textContent=mute?'🔇':'🔊'" style="position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom));padding:6px 12px;z-index:4;font-size:18px">🔊</button>
<div id="win" class="win hide"><div id="conf"></div><div class="wc"><div id="wt">🏆</div><div id="wh"></div><div id="wp"></div><div id="ws"></div><button id="wb" onclick="act(V.me,'again')"></button></div></div>
<div id="menu">
  <div class="card">
    <h2>🁣 دومنو 1 ضد 1</h2>
    <button onclick="startBot()">العب ضد الكمبيوتر</button>
    <button class="g" onclick="netUI('host')">افتح غرفة (هوست)</button>
    <button class="g" onclick="netUI('guest')">انضم لغرفة</button>
    <p style="font-size:12px;opacity:.7">اللعب مع صاحبك: تبعتوا لبعض كود نسخ ولصق مرة واحدة بس. الأفضل تكونوا على نفس الواي فاي.</p>
    <p style="font-size:14px;font-weight:700;margin:10px 0 0;color:#ffe08a">تم إنشاء اللعبة بواسطة مينا عاطف</p>
  </div>
</div>

<div id="net" class="hide">
  <div class="card">
    <h2 id="nt"></h2>
    <p id="n1" style="font-size:13px"></p>
    <textarea id="out" readonly></textarea>
    <button onclick="shareWA()">📲 ابعت على واتساب</button>
    <button class="g" onclick="copyOut()">نسخ اللينك</button>
    <p id="n2" style="font-size:13px"></p>
    <textarea id="inp" placeholder="الصق الكود هنا"></textarea>
    <button id="ok" onclick="applyIn()">تأكيد</button>
    <button class="g" onclick="location.reload()">رجوع</button>
  </div>
</div>

<script>
const $=s=>document.querySelector(s);
const PIPS={0:[],1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const TARGET=100, TURN=25;
// ---------- رسم القطع ----------
function half(n){const h=document.createElement('div');h.className='h';for(let i=0;i<9;i++){const c=document.createElement('div');if(PIPS[n].includes(i))c.className='d';h.appendChild(c)}return h}
function tileEl(t,vert){const e=document.createElement('div');e.className='t'+(vert?' v':'');e.append(half(t[0]),half(t[1]));return e}
// ---------- منطق اللعبة (عند الهوست فقط) ----------
let g,mode,me=0,ch,pc,bot=false;
const sum=h=>h.reduce((s,t)=>s+t[0]+t[1],0);
function newRound(){
  const by=[];for(let i=0;i<=6;i++)for(let j=i;j<=6;j++)by.push([i,j]);
  for(let i=by.length-1;i>0;i--){const k=Math.floor(Math.random()*(i+1));[by[i],by[k]]=[by[k],by[i]]}
  const h=[by.splice(0,7),by.splice(0,7)];
  let best=-1,st=0;h.forEach((hh,p)=>hh.forEach(t=>{const s=t[0]==t[1]?100+t[0]:t[0]+t[1];if(s>best){best=s;st=p}}));
  g={by,h,board:[],cur:st,sc:g?g.sc:[0,0],rd:g?g.rd+1:1,rw:-1,mw:-1,pts:0,drawing:false};
  push();botMaybe();
}
const L=()=>g.board[0][0], R=()=>g.board[g.board.length-1][1];
const can=(t,s)=>!g.board.length||(s==0?(t[0]==L()||t[1]==L()):(t[0]==R()||t[1]==R()));
const has=p=>g.h[p].some(t=>can(t,0)||can(t,1));
function blocked(){return !g.by.length&&!has(0)&&!has(1)}
function act(p,type,t,s){
  if(mode==='guest'){ch.send(JSON.stringify({t:'a',type,tile:t,side:s}));return}
  if(type==='again'){if(g&&g.mw>=0){g.sc=[0,0];newRound()}return}
  if(!g||g.rw>=0||g.cur!==p||g.drawing)return;
  if(type==='play'){
    const i=g.h[p].findIndex(x=>(x[0]==t[0]&&x[1]==t[1])||(x[0]==t[1]&&x[1]==t[0]));
    if(i<0||!can(g.h[p][i],s))return;
    let x=g.h[p].splice(i,1)[0];
    if(!g.board.length)g.board.push(x);
    else if(s==0)g.board.unshift(x[1]==L()?x:[x[1],x[0]]);
    else g.board.push(x[0]==R()?x:[x[1],x[0]]);
    if(g.h[p].length)g.cur=1-p;
  }else if(type==='draw'){
    if(has(p))return;
    drawStep(p);return;
  }
  finish();
}
// سحب ورقة ورقة بينها فاصل زمني
function drawStep(p){
  g.drawing=true;
  if(g.by.length)g.h[p].push(g.by.pop());
  if(!has(p)&&g.by.length){push();setTimeout(()=>drawStep(p),450);return}
  g.drawing=false;
  if(!has(p))g.cur=1-p;
  finish();
}
function finish(){
  let w=-1;
  if(!g.h[0].length)w=0;else if(!g.h[1].length)w=1;
  else if(blocked())w=sum(g.h[0])<=sum(g.h[1])?0:1;
  if(w>=0){
    g.rw=w;g.pts=sum(g.h[1-w]);g.sc[w]+=g.pts;
    if(g.sc[w]>=TARGET)g.mw=w;else setTimeout(newRound,4500);
  }
  push();botMaybe();
}
function botMaybe(){
  if(!bot||g.rw>=0||g.cur!==1||g.drawing)return;
  setTimeout(()=>{
    if(g.rw>=0||g.cur!==1||g.drawing)return;
    let opts=[];g.h[1].forEach(t=>[0,1].forEach(s=>{if(can(t,s))opts.push([t,s])}));
    if(!opts.length){act(1,'draw');return}
    opts.sort((a,b)=>(b[0][0]+b[0][1])-(a[0][0]+a[0][1]));
    act(1,'play',opts[0][0],opts[0][1]);
  },900);
}
const view=p=>({hand:g.h[p],opp:g.h[1-p].length,by:g.by.length,board:g.board,cur:g.cur,me:p,sc:g.sc,rd:g.rd,rw:g.rw,mw:g.mw,pts:g.pts,dr:!!g.drawing});
function push(){render(view(0));if(mode==='host'&&ch&&ch.readyState==='open')ch.send(JSON.stringify({t:'s',v:view(1)}))}
// ---------- الواجهة ----------
let V=null,sel=null,tk='',tleft=TURN,tint=null;
// ---------- الصوت (متولّد بـ WebAudio بدون ملفات) ----------
let AC,mute=false,lastB=-1,lastRd=0,lastBy=-1,lastRw=-1;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
document.addEventListener('pointerdown',ac);
function clack(vol=1,when=0,pitch=1){
  const a=ac();if(!a||mute)return;const t=a.currentTime+when;
  [[1,1],[2,.25]].forEach(([m,k])=>{
    const o=a.createOscillator(),g=a.createGain();
    o.type='sine';o.frequency.value=587*pitch*m;
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.07*vol*k,t+.012);
    g.gain.exponentialRampToValueAtTime(.0001,t+.3);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.32);
  });
}
function clackOld(vol=1,when=0,pitch=1){
  const a=ac();if(!a||mute)return;const t=a.currentTime+when;
  const len=Math.floor(a.sampleRate*.06),buf=a.createBuffer(1,len,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,4);
  const n=a.createBufferSource();n.buffer=buf;
  const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=2200*pitch;f.Q.value=.9;
  const g=a.createGain();g.gain.value=.9*vol;
  n.connect(f);f.connect(g);g.connect(a.destination);n.start(t);
  const o=a.createOscillator(),og=a.createGain();o.type='sine';
  o.frequency.setValueAtTime(190*pitch,t);o.frequency.exponentialRampToValueAtTime(70,t+.07);
  og.gain.setValueAtTime(.7*vol,t);og.gain.exponentialRampToValueAtTime(.001,t+.09);
  o.connect(og);og.connect(a.destination);o.start(t);o.stop(t+.1);
}
function shuffleSnd(){[0,4,7,12].forEach((s,i)=>clack(.5,i*.1,Math.pow(2,s/12)*.75))}
function chime(win){
  const a=ac();if(!a||mute)return;
  (win?[523,659,784,1047]:[392,330]).forEach((f,i)=>{
    const t=a.currentTime+i*.14,o=a.createOscillator(),g=a.createGain();
    o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.25,t);g.gain.exponentialRampToValueAtTime(.001,t+.35);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.4);
  });
}
function sfx(v){
  if(v.rd!==lastRd){lastRd=v.rd;lastB=v.board.length;lastBy=v.by;lastRw=-1;shuffleSnd()}
  else{
    if(v.board.length>lastB)clack();
    else if(v.by<lastBy)clack(.4,0,1.3);
    lastB=v.board.length;lastBy=v.by;
  }
  if(v.rw>=0&&lastRw<0){lastRw=v.rw;chime(v.rw===v.me)}
}
function render(v){
  sfx(v);V=v;const m=v.me;
  const mine=v.sc[m],theirs=v.sc[1-m];
  $('#score').textContent=`أنت ${mine} : ${theirs} الخصم  (حتى ${TARGET})`;
  $('#info').textContent=`الجولة ${v.rd} · البوكس ${v.by}`;
  $('#opp').innerHTML='<span class="back"></span>'.repeat(v.opp);
  const bin=$('#bin');bin.innerHTML='';
  const pb=window._pb||[];let ni=-1;
  if(v.rd===window._pr&&v.board.length>pb.length)ni=(!pb[0]||v.board[0][0]!==pb[0][0]||v.board[0][1]!==pb[0][1])?0:v.board.length-1;
  window._pb=v.board.map(t=>t.slice());window._pr=v.rd;
  const zone=(s,c)=>{const z=document.createElement('div');z.className='zone';z.textContent=c;z.onclick=()=>go(s);return z};
  const two=sel&&v.cur===m&&v.rw<0&&v.board.length>1&&v.hand.some(x=>x[0]==sel[0]&&x[1]==sel[1])&&sidesFor(sel).length===2;
  if(two)bin.appendChild(zone(0,'◀'));
  v.board.forEach((t,i)=>{const e=tileEl(t,t[0]==t[1]);if(i===ni)e.classList.add('new');bin.appendChild(e)});
  if(two)bin.appendChild(zone(1,'▶'));
  const b=$('#board');
  bin.style.zoom=v.board.length>20?.62:v.board.length>14?.74:v.board.length>9?.88:1;
  const nt=bin.querySelector('.new')||bin.querySelector('.zone');
  if(nt){const r=nt.getBoundingClientRect(),br=b.getBoundingClientRect();if(r.bottom>br.bottom)b.scrollTop+=r.bottom-br.bottom+10;else if(r.top<br.top)b.scrollTop-=br.top-r.top+10}
  const hand=$('#hand');hand.innerHTML='';
  const myTurn=v.cur===m&&v.rw<0;
  const L_=v.board.length?v.board[0][0]:-1,R_=v.board.length?v.board[v.board.length-1][1]:-1;
  const ok=t=>!v.board.length||t[0]==L_||t[1]==L_||t[0]==R_||t[1]==R_;
  const sorted=[...v.hand].sort((a,b)=>(b[0]+b[1])-(a[0]+a[1]));
  const pk=t=>Math.min(t[0],t[1])+'-'+Math.max(t[0],t[1]);
  const prevH=(window._pr2===v.rd&&window._ph)?window._ph:null;
  sorted.forEach(t=>{
    const e=tileEl(t,true);e.className='t'+(myTurn&&ok(t)?' ok':'')+(sel&&sel[0]==t[0]&&sel[1]==t[1]?' sel':'')+(prevH&&!prevH.has(pk(t))?' new':'');
    e.onclick=()=>pick(t);hand.appendChild(e);
  });
  window._ph=new Set(v.hand.map(pk));window._pr2=v.rd;
  const any=v.hand.some(ok);
  $('#drawBtn').classList.toggle('hide',!(myTurn&&!any)||v.dr);
  $('#drawBtn').textContent=v.by?'اسحب':'عدّي';
  $('#sides').innerHTML='';
  $('#msg').textContent=v.mw>=0?(v.mw===m?'🏆 كسبت الماتش!':'خسرت الماتش'):v.rw>=0?(v.rw===m?'كسبت الجولة 👏 الجولة الجاية بعد ثواني':'الخصم كسب الجولة'):(myTurn?(two?'اختار الجهة اللي عايزها ◀ ▶':'دورك'):'دور الخصم...');
  showWin(v);
  const key=v.rd+'-'+v.board.length+'-'+v.by+'-'+v.cur+'-'+v.hand.length;
  if(key!==tk){tk=key;tleft=TURN;sel=null}
  clearInterval(tint);
  if(myTurn){tint=setInterval(()=>{tleft--;ring();if(tleft<=0){clearInterval(tint);auto()}},1000)}
  ring(myTurn);
}
let winShown=false;
function confetti(){const c=$('#conf');c.innerHTML='';for(let i=0;i<44;i++){const s=document.createElement('i');s.style.cssText=`left:${Math.random()*100}%;background:hsl(${Math.random()*360},90%,60%);animation-delay:${Math.random()*.9}s;animation-duration:${1.9+Math.random()*1.6}s`;c.appendChild(s)}}
function showWin(v){
  const w=$('#win');
  if(v.rw<0){w.classList.add('hide');winShown=false;return}
  const match=v.mw>=0;
  const won=(match?v.mw:v.rw)===v.me;
  w.onclick=()=>{if(V&&V.mw<0)w.classList.add('hide')};
  $('#wt').textContent=match?(won?'🏆':'🥈'):(won?'🎉':'🥈');
  $('#wh').textContent=match?(won?'كسبت الجيم!':'خسرت الجيم'):(won?'كسبت الجولة!':'خسرت الجولة');
  $('#wp').textContent=match?'':(won?'+'+v.pts+' نقطة ليك':'+'+v.pts+' نقطة للخصم')+' · الجولة الجاية بعد ثواني';
  $('#ws').textContent=v.sc[v.me]+' : '+v.sc[1-v.me];
  $('#wb').textContent=won?'كمّل 🔥':'جيم تاني 🔥';$('#wb').classList.toggle('hide',!match);
  w.className='win won';
  if(match&&won&&!winShown)confetti(); else if(!(match&&won))$('#conf').innerHTML='';
  winShown=true;
}
function ring(on=true){const r=$('#ring');r.textContent=on?tleft:'-';r.classList.toggle('low',tleft<=8)}
function sidesFor(t){return [0,1].filter(s=>{const L_=V.board[0]?.[0],R_=V.board[V.board.length-1]?.[1];return !V.board.length||(s==0?(t[0]==L_||t[1]==L_):(t[0]==R_||t[1]==R_))})}
function pick(t){
  if(!V||V.cur!==V.me||V.rw>=0||V.dr)return;
  const s=sidesFor(t);if(!s.length)return;
  const Lv=V.board[0]?.[0],Rv=V.board[V.board.length-1]?.[1];
  // تتلعب على طول لو: جهة واحدة بس، أو أول ورقة، أو الطرفين نفس الرقم
  if(s.length===1||V.board.length<=1||Lv===Rv){act(V.me,'play',t,s[0]);return}
  sel=(sel&&sel[0]==t[0]&&sel[1]==t[1])?null:t;render(V);
}
function go(s){const t=sel;sel=null;if(t)act(V.me,'play',t,s)}
function auto(){
  for(const t of V.hand){const s=sidesFor(t);if(s.length){act(V.me,'play',t,s[0]);return}}
  act(V.me,'draw');
}
$('#drawBtn').onclick=()=>act(V.me,'draw');
// ---------- أوضاع اللعب ----------
function startBot(){$('#menu').classList.add('hide');mode='bot';bot=true;me=0;g=null;newRound()}
const CFG={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
const BASE='https://claude.ai/artifact/GbomhGgY6HzHRN6rNpaGUK';
const b64u=u=>btoa(String.fromCharCode(...u)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=s=>Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
async function pipe(bytes,S){const r=new Response(new Blob([bytes]).stream().pipeThrough(new S('deflate-raw')));return new Uint8Array(await r.arrayBuffer())}
const enc=async o=>b64u(await pipe(new TextEncoder().encode(JSON.stringify(o)),CompressionStream));
const dec=async s=>JSON.parse(new TextDecoder().decode(await pipe(unb64u(s),DecompressionStream)));
function waitIce(){return new Promise(r=>{if(pc.iceGatheringState==='complete')return r();pc.onicegatheringstatechange=()=>pc.iceGatheringState==='complete'&&r();setTimeout(r,4000)})}
function linkBase(){return /^https?:/.test(location.protocol)&&!/claude|anthropic/.test(location.hostname)?location.href.split('#')[0]:BASE}
function adapt(conn){
  ch={send:s=>conn.send(s),get readyState(){return conn.open?'open':'closed'}};
  hook();
  conn.on('open',()=>ch.onopen&&ch.onopen());
  conn.on('data',d=>ch.onmessage&&ch.onmessage({data:d}));
  conn.on('close',()=>ch.onclose&&ch.onclose());
  if(conn.open&&ch.onopen)ch.onopen();
}
// لينك مباشر: الصاحب يفتح اللينك فتبدأ اللعبة فوراً (PeerJS)
function instantHost(){
  if(!window.Peer)return Promise.resolve(false);
  return new Promise(res=>{
    let done=false;const fin=v=>{if(!done){done=true;res(v)}};
    let peer;try{peer=new Peer()}catch(e){return fin(false)}
    setTimeout(()=>fin(false),7000);
    peer.on('error',()=>fin(false));
    peer.on('open',id=>{
      $('#out').value=linkBase()+'#r'+id;
      $('#n1').textContent='ابعت اللينك ده لصاحبك، أول ما يفتحه اللعبة هتبدأ لوحده 👇';
      fin(true);
    });
    peer.on('connection',conn=>{if(!ch)adapt(conn)});
  });
}
async function netUI(role){
  $('#menu').classList.add('hide');$('#net').classList.remove('hide');
  mode=role;
  if(role==='host'){
    $('#nt').textContent='افتح غرفة';$('#n1').textContent='جاري تجهيز اللينك...';$('#n2').textContent='';
    $('#inp').classList.add('hide');$('#ok').classList.add('hide');
    if(await instantHost())return;
    $('#inp').classList.remove('hide');$('#ok').classList.remove('hide');
  }
  pc=new RTCPeerConnection(CFG);
  if(role==='host'){
    $('#nt').textContent='افتح غرفة';
    $('#n1').textContent='1) ابعت اللينك ده لصاحبك على واتساب';
    $('#n2').textContent='2) لما يرد عليك، الصق رسالته هنا واضغط تأكيد';
    ch=pc.createDataChannel('d');hook();
    await pc.setLocalDescription(await pc.createOffer());await waitIce();
    $('#out').value=BASE+'#o'+await enc(pc.localDescription);
  }else{
    $('#nt').textContent='انضم لغرفة';
    $('#n1').textContent='1) الصق لينك صاحبك واضغط تأكيد';
    $('#n2').textContent='2) هيظهر لك لينك الرد: ابعته له';
    pc.ondatachannel=e=>{ch=e.channel;hook()};
  }
}
const tok=s=>{const m=s.match(/#?([oa][A-Za-z0-9_\-]{100,})/);return m&&m[1]};
async function guestAnswer(d){
  await pc.setRemoteDescription(d);
  await pc.setLocalDescription(await pc.createAnswer());await waitIce();
  $('#out').value=BASE+'#a'+await enc(pc.localDescription);
}
async function applyIn(){
  try{
    const t=tok($('#inp').value);
    const d=await dec(t.slice(1));
    if(mode==='host')await pc.setRemoteDescription(d);
    else await guestAnswer(d);
  }catch(e){alert('اللينك مش صحيح')}
}
function copyOut(){const o=$('#out');o.select();try{navigator.clipboard.writeText(o.value)}catch(e){document.execCommand('copy')}}
function shareWA(){
  const u=$('#out').value;if(!u)return;
  const txt=(mode==='host'?'تعالى نلعب دومنو 🎲 افتح اللينك:\n':'ده ردي، الصقه في اللعبة:\n')+u;
  if(navigator.share){navigator.share({text:txt}).catch(()=>{})}
  else window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}
(async()=>{
  const h=location.hash.slice(1);
  if(h[0]==='r'&&h.length>10){
    mode='guest';$('#menu').classList.add('hide');$('#msg').textContent='جاري الاتصال بالغرفة...';
    if(!window.Peer){$('#msg').textContent='مش قادر يتصل بالغرفة';return}
    const peer=new Peer();
    peer.on('error',()=>{$('#msg').textContent='مش قادر يتصل بالغرفة، تأكد من اللينك'});
    peer.on('open',()=>adapt(peer.connect(h.slice(1),{reliable:true})));
    return;
  }
  if(h[0]!=='o'||h.length<100)return;
  try{
    await netUI('guest');
    $('#n1').textContent='جاري تجهيز الرد...';$('#n2').textContent='';
    $('#inp').classList.add('hide');$('#ok').classList.add('hide');
    await guestAnswer(await dec(h.slice(1)));
    $('#n1').textContent='ابعت اللينك ده لصاحبك عشان تبدأوا اللعب 👇';
  }catch(e){$('#n1').textContent='اللينك مش صحيح'}
})();
function hook(){
  ch.onopen=()=>{$('#net').classList.add('hide');$('#oppname').textContent='صاحبك';
    if(mode==='host'){me=0;bot=false;g=null;newRound()}else me=1};
  ch.onclose=()=>{$('#msg').textContent='الاتصال اتقطع'};
  ch.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.t==='s')render(m.v);
    else if(m.t==='a'&&mode==='host')act(1,m.type,m.tile,m.side);
  };
}
